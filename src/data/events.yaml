# World events attested by documents in the archive. Every event MUST cite
# the artifacts that attest it — where the record is silent, the chronology
# is silent. Add a document first, then the event.
#
#   date:    sort key — "YYYY", "YYYY-MM", or "YYYY-MM-DD" (keep the quotes)
#   era:     optional group heading when the year is approximate ("The 1940s")
#   title:   what happened
#   blurb:   optional one-liner after the title
#   flags:   optional polity codes from src/lib/flags.ts
#   attests: artifact file names (no .md) that attest this event
#
# The build FAILS on an unknown flag code or artifact name. That's on purpose.

- date: "1945"
  era: The 1940s
  title: The two German states go their separate ways
  blurb: The Federal Republic in the west, the Deutscher Freistaat in the east. The record does not yet say how.
  flags: [de, de-gdr]
  attests: [our-world-today]

- date: "1968-05"
  title: May 1968
  blurb: Huge protests change the French government.
  flags: [fr]
  attests: [our-world-today]

- date: "1974-04"
  title: The carnation revolution in Portugal
  blurb: Soldiers put flowers in their rifles instead of firing them at protestors.
  flags: [pt]
  attests: [our-world-today]

- date: "1974-05-18"
  title: "The Treaty of Lyon: the Union sociale is founded!"
  blurb: Social-democratic state protection "from the cradle to the grave."
  flags: [union-sociale, fr, pt]
  attests: [our-world-today]

- date: "1975"
  title: Franco falls, the republic returns!
  blurb: A country without a king, supported by their social democratic neighbours to the north and west.
  flags: [es]
  attests: [our-world-today]

- date: "1994-01-15"
  title: Berlin declares itself the Volksstadt
  blurb: Read aloud twice — once for the hall, once for the square.
  flags: [volksstadt-berlin]
  attests: [our-world-today]

- date: "2002-06-03"
  title: The Treaty of Frankfurt — the Europäischer Bund is founded
  blurb: Eleven minutes of ceremony after nine years of negotiation.
  flags: [bund]
  attests: [our-world-today]
